{% extends "base.html" %}{% block title %}My Profile{% endblock %}
{% block content %}<div class="page-head"><div><p class="eyebrow">ACCOUNT SETTINGS</p><h1>My profile</h1><p class="muted">Update your personal details.</p></div></div><form method="post" class="panel form narrow"><label>Full name<input name="name" required value="{{ user.name }}"></label><label>Email address<input value="{{ user.email }}" disabled><small class="muted">Email cannot be changed here.</small></label><label>Phone number<input name="phone" value="{{ user.phone or '' }}"></label><label>Department / course<input name="department" value="{{ user.department or '' }}"></label><button class="full">Save profile</button></form>{% endblock %}

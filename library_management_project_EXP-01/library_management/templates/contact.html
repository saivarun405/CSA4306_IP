{% extends "base.html" %}{% block title %}Contact Library{% endblock %}
{% block content %}<div class="page-head"><div><p class="eyebrow">WE'RE HERE TO HELP</p><h1>Contact the library</h1><p class="muted">Ask about book availability, borrowing, fines, or study resources.</p></div></div><form method="post" class="panel form narrow"><label>Your name<input name="name" required value="{{ logged_user.name if logged_user else '' }}"></label><label>Email address<input type="email" name="email" required value="{{ logged_user.email if logged_user else '' }}"></label><label>Message<textarea name="message" rows="6" required placeholder="How can we help?"></textarea></label><button class="full">Send message</button><p class="muted small">This demo stores messages in the database. It does not send email notifications.</p></form>{% endblock %}

{% extends "base.html" %}{% block title %}Upload Material{% endblock %}
{% block content %}<div class="page-head"><div><p class="eyebrow">RESOURCE LIBRARY</p><h1>Upload study material</h1><p class="muted">Tag the file so students can find it by year and semester.</p></div></div><form method="post" enctype="multipart/form-data" class="panel form narrow">
<label>Material title *<input name="title" required placeholder="e.g. Data Structures Unit 1 Notes"></label><label>Subject<input name="subject" placeholder="e.g. Data Structures"></label>
<div class="form-grid"><label>Academic year *<select name="year" required><option value="">Select year</option>{% for y in ['1','2','3','4'] %}<option value="{{ y }}">Year {{ y }}</option>{% endfor %}</select></label><label>Semester *<select name="semester" required><option value="">Select semester</option>{% for s in ['1','2','3','4','5','6','7','8'] %}<option value="{{ s }}">Semester {{ s }}</option>{% endfor %}</select></label></div>
<label>Description<textarea name="description" rows="3"></textarea></label><label>Choose file *<input type="file" name="file" required accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,.zip"><small class="muted">Allowed: PDF, DOC, DOCX, PPT, PPTX, TXT, ZIP. Maximum 20 MB.</small></label><button class="full">Upload material</button></form>{% endblock %}

{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1><p class="muted">Access your library account.</p>
<form method="post" class="form">
<label>Email address<input type="email" name="email" required autocomplete="username" placeholder="you@college.edu"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="Your password"></label>
<button class="full">Login to account</button></form><p class="muted center">New here? <a href="{{ url_for('register') }}">Create a student account</a></p></div></section>{% endblock %}
